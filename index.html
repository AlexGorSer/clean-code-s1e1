<!DOCTYPE html>
<html>
  <head>
    <title>Todo App</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
    <link rel="stylesheet" href="style.css" media="screen" charset="utf-8">
  </head>
  <body class="page">
    <header class="header">
      <img class="header__img" src="./eisenhower-matrix.jpg" alt="eisenhower-matrix">
      <a class="header__info" href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
    </header>
    <main class="main">
      <article>
        <section class="add-item">
          <h1>
            <label class="add-item__new-task-label" for="new-task">Add Item</label>
          </h1>
          <div class="add-item__row-wrapper">
            <input id="new" class="add-item__text-input text-input task" type="text">
            <button class="add-item__button button">Add</button>
          </div>
        </section>
        <section class="todo">
          <h3 class="todo__heading heading">Todo</h3>
          <ul class="todo__tasks-container tasks-container" id="incomplete">
            <li class="todo__item-list item-list">
              <input class="item-list__input-checkbox" type="checkbox">
              <label class="item-list__label-item task">Pay Bills</label>
              <input class="item-list__text-input text-input task" type="text">
              <button class="item-list__button button item-list__button_edit">Edit</button>
              <button class="item-list__button button item-list__button_delete">
                <img class="item-list__remove-icon remove-icon" src="./remove.svg" alt="remove-icon">
              </button>
            </li>
            <li class="todo__item-list item-list edit-mode">
              <input class="item-list__input-checkbox" type="checkbox">
              <label class="item-list__label-item task">Go Shopping</label>
              <input class="tem-list__text-input text-input task" type="text" value="Go Shopping">
              <button class="item-list__button button item-list__button_edit">Save</button>
              <button class="item-list__button button item-list__button_delete">
                <img class="item-list__remove-icon remove-icon" src="./remove.svg" alt="remove-icon">
              </button>
            </li>
          </ul>
        </section>
        <section class="compleded">
          <h3 class="compleded__heading heading">Completed</h3>
          <ul class="compleded__tasks-container tasks-container" id="completed">
            <li class="compleded__item-list item-list">
              <input class="item-list__input-checkbox" type="checkbox" checked>
              <label class="item-list__task task">See the Doctor</label>
              <input class="item-list__text-input text-input task" type="text" class="task">
              <button class="item-list__button button item-list__button_edit">Edit</button>
              <button class="item-list__button button item-list__button_delete">
                <img class="item-list__remove-icon remove-icon" src="./remove.svg" alt="remove-icon">
              </button>
            </li>
          </ul>
        </section>
      </article>
    </main>
    <script src="app.js"></script>
  </body>
</html>
